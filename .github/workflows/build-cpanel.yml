
name: Build cPanel Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Package dist for cPanel
        run: |
          cd dist
          zip -r ../sparkmedia-cpanel-dist.zip .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sparkmedia-cpanel-dist
          path: sparkmedia-cpanel-dist.zip
          retention-days: 7
